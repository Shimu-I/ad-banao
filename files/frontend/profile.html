<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your profile · AdBanao</title>
<style>
  :root{--bg:#F6F1E3;--panel:#FBF8EE;--field:#fff;--fg:#12301F;--soft:#4A5A4E;--line:#E1D8BE;--brand:#1B4D34;--ok-bg:#E2EDD4;--err-bg:#F9DCD4;--err-fg:#8C2B14}
  @media (prefers-color-scheme:dark){:root{--bg:#0B1510;--panel:#101E16;--field:#0B1510;--fg:#E9EFDB;--soft:#A9B8A8;--line:#22372A;--brand:#8CC79F;--ok-bg:#1d3a28;--err-bg:#3d1f18;--err-fg:#f1b4a4}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Inter,"Hind Siliguri",system-ui,sans-serif}
  main{max-width:560px;margin:0 auto;padding:32px 16px 64px}
  h1{font-size:1.6rem;margin:0 0 4px} p.sub{color:var(--soft);margin:0 0 24px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
  h2{font-size:1.05rem;margin:0 0 12px}
  label{display:block;font-size:.9rem;margin:12px 0 4px}
  input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--fg);font:inherit}
  input[disabled]{opacity:.7}
  button{margin-top:16px;padding:10px 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
  @media (prefers-color-scheme:dark){button{color:#0B1510}}
  button:disabled{opacity:.6;cursor:wait}
  :focus-visible{outline:3px solid var(--brand);outline-offset:2px}
  .msg{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}
  .msg.ok{display:block;background:var(--ok-bg)} .msg.err{display:block;background:var(--err-bg);color:var(--err-fg)}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  a{color:var(--brand)}
</style>
</head>
<body>
<main>
  <header><a href="/index.html"><strong>AdBanao</strong></a><span style="display:flex;align-items:center;gap:12px"><span id="avatar" title="" style="width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:none;place-items:center;font-weight:700;text-transform:uppercase"></span><button class="ghost" id="logout" style="margin:0">Sign out</button></span></header>
  <h1>Your profile</h1>
  <p class="sub" id="who">Loading…</p>

  <section>
    <h2>Details</h2>
    <form id="profile" novalidate>
      <label for="email">Email</label><input id="email" disabled>
      <label for="display_name">Name</label><input id="display_name" required maxlength="100" autocomplete="name">
      <label for="business_name">Business name (optional)</label><input id="business_name" maxlength="200" autocomplete="organization">
      <label for="phone">Phone (optional)</label><input id="phone" maxlength="30" autocomplete="tel" inputmode="tel">
      <label for="language">Language</label>
      <select id="language"><option value="en">English</option><option value="bn">বাংলা</option></select>
      <button type="submit">Save changes</button>
      <div class="msg" id="profile-msg" role="status"></div>
    </form>
  </section>

  <section>
    <h2>Change password</h2>
    <form id="password" novalidate>
      <label for="current">Current password</label><input id="current" type="password" autocomplete="current-password">
      <label for="next">New password (8 or more characters)</label><input id="next" type="password" autocomplete="new-password">
      <button type="submit">Change password</button>
      <div class="msg" id="password-msg" role="status"></div>
    </form>
  </section>
</main>

<script src="auth/auth.js"></script>
<script>
  var $ = function (id) { return document.getElementById(id); };
  function show(el, text, ok) { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); }
  function fill(u) {
    $("who").textContent = "Signed in as " + u.email;
    var av = $("avatar"); av.textContent = (Array.from(u.display_name || u.email)[0] || "?"); av.title = u.email; av.style.display = "grid";
    ["email", "display_name", "business_name", "phone", "language"].forEach(function (k) { $(k).value = u[k] || ""; });
  }
  function busy(form, on) { form.querySelector("button").disabled = on; }

  AdBanaoAuth.requireUser("/index.html#signin").then(fill).catch(function () {});

  $("profile").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, msg = $("profile-msg");
    if (!$("display_name").value.trim()) { show(msg, "Name is required.", false); return; }
    busy(f, true);
    AdBanaoAuth.updateProfile({
      display_name: $("display_name").value,
      business_name: $("business_name").value.trim() || null,
      phone: $("phone").value.trim() || null,
      language: $("language").value,
    }).then(function (u) { fill(u); show(msg, "Saved.", true); })
      .catch(function (err) { show(msg, err.message, false); })
      .then(function () { busy(f, false); });
  });

  $("password").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, msg = $("password-msg");
    busy(f, true);
    AdBanaoAuth.changePassword($("current").value, $("next").value)
      .then(function () { $("current").value = ""; $("next").value = ""; show(msg, "Password changed. Other devices were signed out.", true); })
      .catch(function (err) { show(msg, err.message, false); })
      .then(function () { busy(f, false); });
  });

  $("logout").addEventListener("click", function () {
    AdBanaoAuth.logout().catch(function () {}).then(function () { window.location.href = "/index.html#signin"; });
  });
</script>
</body>
</html>
