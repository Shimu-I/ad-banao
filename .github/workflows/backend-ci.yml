name: backend-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # The whole suite runs twice: on SQLite (quick) and on a real PostgreSQL 16 (what production uses).
    name: test (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adbanao
          POSTGRES_PASSWORD: adbanao
          POSTGRES_DB: adbanao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adbanao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://adbanao:adbanao@localhost:5432/adbanao_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt ruff mypy
      - name: Lint
        if: matrix.database == 'sqlite'
        run: ruff check backend
      - name: Type check (reported, not blocking yet)
        if: matrix.database == 'sqlite'
        run: mypy
        continue-on-error: true
      - name: Tests
        run: python -m pytest -ra

  end-to-end:
    # Starts the real API (on PostgreSQL) and the pages, then drives them like a user (API checks and a browser).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adbanao
          POSTGRES_PASSWORD: adbanao
          POSTGRES_DB: adbanao
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adbanao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adbanao:adbanao@localhost:5432/adbanao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt playwright
          playwright install --with-deps chromium
      - name: Create the tables with migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Start the API and the pages
        working-directory: backend
        env:
          UPLOAD_DIR: ./e2e-uploads
          ADMIN_EMAILS: admin@demo.adbanao.test=banao-demo-secret
        run: |
          nohup python -m uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          (cd ../frontend && nohup python -m http.server 5173 > ../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: API smoke test
        run: python scripts/smoke_test.py http://localhost:8000
      - name: "Demo users (run twice, must be repeatable)"
        run: |
          python scripts/seed_demo.py http://localhost:8000
          python scripts/seed_demo.py http://localhost:8000
      - name: Browser test of sign up, sign in, profile, sign out
        run: python scripts/e2e_auth.py
      - name: "Admin checks (privileges, suspend, activity log, CSV)"
        run: python scripts/e2e_admin.py http://localhost:8000
      - name: Browser test of the admin page
        run: python scripts/e2e_admin_page.py
      - name: Server log (on failure)
        if: failure()
        run: cat api.log

  start-script:
    # The one-command start the owner uses (apply-fix.sh, start-adbanao.sh, stop-adbanao.sh) on a fresh database:
    # PostgreSQL in Docker (the default) and the optional SQLite quick start.
    name: start-script (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, sqlite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the start-script check
        run: ./scripts/check_start_scripts.sh ${{ matrix.database }}

  lock:
    # Pins every package (and its dependencies, with hashes) so two installs are identical.
    # Fails if requirements.in changed but requirements.txt was not recompiled. The compiled files are
    # uploaded as an artifact on every run, so the fix is: download, commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Compile the lock files (existing pins are kept; only new needs are resolved)
        working-directory: backend
        run: |
          mkdir -p /tmp/lock
          for name in requirements requirements-dev; do
            if grep -q -- '--hash=' "$name.txt" 2>/dev/null; then cp "$name.txt" "/tmp/lock/$name.txt"; fi
            uv pip compile "$name.in" --universal --generate-hashes --python-version 3.12 --no-header -o "/tmp/lock/$name.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: lock-files
          path: /tmp/lock/*.txt
      - name: Print the compiled files (so they can be read from this log and committed)
        if: always()
        run: |
          for name in requirements requirements-dev; do echo "=====BEGIN $name.txt"; cat "/tmp/lock/$name.txt"; echo "=====END $name.txt"; done
      - name: Check the committed lock files are up to date
        working-directory: backend
        run: |
          for name in requirements requirements-dev; do
            diff -u "$name.txt" "/tmp/lock/$name.txt" || { echo "::error::backend/$name.txt is not the compiled form of $name.in. Download the lock-files artifact from this run and commit it."; exit 1; }
          done
